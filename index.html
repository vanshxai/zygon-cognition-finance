<script>
// Zygon Finance engine. Plain JS, no libraries. All money = whole paise (integers).
// RULE: the engine never guesses. If more than one answer fits, it makes a QUESTION and waits.
const Engine = (function () {
  // ---------- money / dates ----------
  function parseMoney(s) {
    if (typeof s === 'number') return Math.round(s * 100);
    s = String(s == null ? '' : s).trim();
    if (!s) return null;
    const neg = /^\(.*\)$/.test(s) || /^-/.test(s) || /-$/.test(s);
    const clean = s.replace(/[^0-9.]/g, '');
    if (!/[0-9]/.test(clean)) return null;
    const parts = clean.split('.');
    const whole = parseInt(parts[0] || '0', 10);
    const frac = parseInt(((parts[1] || '') + '00').slice(0, 2), 10);
    const v = whole * 100 + frac;
    return neg ? -v : v;
  }
  const MON = { jan: 0, feb: 1, mar: 2, apr: 3, may: 4, jun: 5, jul: 6, aug: 7, sep: 8, oct: 9, nov: 10, dec: 11 };
  function dayNum(y, m, d) { return Math.round(Date.UTC(y, m, d) / 86400000); }
  function parseDate(s) {
    if (s == null || s === '') return null;
    if (typeof s === 'number') { // Excel serial date
      if (s > 20000 && s < 80000) return Math.round(s - 25569);
      return null;
    }
    s = String(s).trim();
    let m;
    if ((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return dayNum(+m[1], m[2] - 1, +m[3]);
    if ((m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/))) {
      let y = +m[3]; if (y < 100) y += 2000;
      return dayNum(y, m[2] - 1, +m[1]); // day first (Indian statements)
    }
    if ((m = s.match(/^(\d{1,2})[\s\-]([A-Za-z]{3})[a-z]*[\s\-,]*(\d{2,4})/))) {
      let y = +m[3]; if (y < 100) y += 2000;
      const mo = MON[m[2].toLowerCase()];
      if (mo !== undefined) return dayNum(y, mo, +m[1]);
    }
    return null;
  }
  function fmtDate(n) {
    if (n == null) return '';
    const d = new Date(n * 86400000);
    return String(d.getUTCDate()).padStart(2, '0') + '-' + String(d.getUTCMonth() + 1).padStart(2, '0') + '-' + d.getUTCFullYear();
  }
  let fmtHook = null;
  function fmtMoney(p) { return fmtHook ? fmtHook(p) : fmtINR(p); }
  function setFmt(fn) { fmtHook = fn; }
  function fmtINR(p) { // Indian digit grouping: 12,34,567.89
    const neg = p < 0; p = Math.abs(p);
    const r = Math.floor(p / 100), f = String(p % 100).padStart(2, '0');
    let s = String(r);
    if (s.length > 3) {
      const last = s.slice(-3); let rest = s.slice(0, -3);
      rest = rest.replace(/\B(?=(\d{2})+(?!\d))/g, ',');
      s = rest + ',' + last;
    }
    return (neg ? '-' : '') + '₹' + s + '.' + f;
  }
  function divRound(a, b) { // round half up, integers only
    return Math.floor((2 * a + b) / (2 * b));
  }

  // ---------- CSV ----------
  function parseCSV(text) {
    const rows = []; let row = [], cur = '', q = false;
    text = text.replace(/^﻿/, '');
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (q) {
        if (c === '"' && text[i + 1] === '"') { cur += '"'; i++; }
        else if (c === '"') q = false;
        else cur += c;
      } else if (c === '"') q = true;
      else if (c === ',') { row.push(cur); cur = ''; }
      else if (c === '\n' || c === '\r') {
        if (c === '\r' && text[i + 1] === '\n') i++;
        row.push(cur); cur = '';
        if (row.some(x => x.trim() !== '')) rows.push(row);
        row = [];
      } else cur += c;
    }
    row.push(cur);
    if (row.some(x => x.trim() !== '')) rows.push(row);
    return rows;
  }

  // ---------- reading tables into bank lines / invoices ----------
  function findCol(head, pats) {
    for (let i = 0; i < head.length; i++) for (const p of pats) if (p.test(head[i])) return i;
    return -1;
  }
  function detectKind(rows) {
    if (!rows.length) return 'sheet';
    const head = rows[0].map(x => String(x).toLowerCase());
    const has = p => findCol(head, [p]) >= 0;
    if ((has(/debit|withdraw/) || has(/credit|deposit/)) && has(/balance/)) return 'bank';
    if (has(/invoice|inv\s*no|bill/) && has(/customer|party|client|name/)) return 'ledger';
    if (has(/customer|party|client/) && has(/amount|total|value/)) return 'ledger';
    return 'sheet';
  }
  function readBank(rows) {
    const warn = [];
    const head = rows[0].map(x => String(x).toLowerCase());
    const iD = findCol(head, [/^date|txn date|value date|tran date/]);
    const iT = findCol(head, [/narration|description|particular|details|remark/]);
    const iDr = findCol(head, [/debit|withdraw|dr\b/]);
    const iCr = findCol(head, [/credit|deposit|cr\b/]);
    const iB = findCol(head, [/balance/]);
    const lines = [];
    let skipped = 0;
    for (let r = 1; r < rows.length; r++) {
      const x = rows[r];
      const date = parseDate(x[iD]);
      if (date == null) { skipped++; continue; }
      const dr = iDr >= 0 ? (parseMoney(x[iDr]) || 0) : 0;
      const cr = iCr >= 0 ? (parseMoney(x[iCr]) || 0) : 0;
      lines.push({ id: 'B' + String(lines.length + 1).padStart(4, '0'), date, desc: String(x[iT] || '').trim(),
        debit: Math.abs(dr), credit: Math.abs(cr), balance: iB >= 0 ? parseMoney(x[iB]) : null });
    }
    if (skipped) warn.push(skipped + ' row(s) skipped because the date could not be read');
    if (iD < 0 || iT < 0) warn.push('Could not find a date or description column');
    return { lines, warn };
  }
  function readLedger(rows) {
    const warn = [];
    const head = rows[0].map(x => String(x).toLowerCase());
    const iId = findCol(head, [/invoice|inv\s*no|bill|^id$|doc/]);
    const iC = findCol(head, [/customer|party|client|name/]);
    const iD = findCol(head, [/date/]);
    const iA = findCol(head, [/amount|total|value/]);
    const iType = findCol(head, [/type/]);
    const items = []; let skipped = 0;
    for (let r = 1; r < rows.length; r++) {
      const x = rows[r];
      let amt = parseMoney(x[iA]); const date = parseDate(x[iD]); const cust = String(x[iC] || '').trim();
      if (amt == null || date == null || !cust) { skipped++; continue; }
      const t = iType >= 0 ? String(x[iType]).toLowerCase() : '';
      if (/credit/.test(t) && amt > 0) amt = -amt;
      items.push({ id: String(x[iId] || 'ROW' + r).trim(), customer: cust, date, amount: amt });
    }
    if (skipped) warn.push(skipped + ' row(s) skipped (missing date, amount or customer)');
    return { items, warn };
  }

  // ---------- bank balance audit ----------
  function auditBank(lines) {
    const errors = []; let prev = null;
    for (const l of lines) {
      if (l.balance == null) continue;
      if (prev != null) {
        const expect = prev + l.credit - l.debit;
        if (expect !== l.balance) {
          errors.push({ id: l.id, date: l.date, desc: l.desc, expect, shown: l.balance, diff: l.balance - expect });

    return `<tr class="${cls}" data-k="${l.key}"><td class="n">${D(l.date)}</td><td>${esc(l.desc)}</td><td class="n r">${l.debit ? plainNum(l.debit, f.cur) : ''}</td><td class="n r">${l.credit ? plainNum(l.credit, f.cur) : ''}</td><td class="n r">${l.balance != null ? plainNum(l.balance, f.cur) : ''}</td><td>${chip}</td></tr>`;
  }).join('');
  const sym = S.disp === 'INR' ? '₹' : '$';
  return `${docHead(f, fi, `<label><input type="checkbox" data-only="${fi}"${only ? ' checked' : ''}> Show only problems${probs ? ' (' + probs + ')' : ''}</label>`)}
  <div class="paper"><div class="papermeta"><span>Period <b>${first ? D(first.date) : ''} – ${last ? D(last.date) : ''}</b></span>${open != null ? `<span>Opening balance <b>${M(open, f.cur)}</b></span>` : ''}${last && last.balance != null ? `<span>Closing balance <b>${M(last.balance, f.cur)}</b></span>` : ''}<span><b>${rows.length}</b> lines</span></div>
  <div class="scroll"><table class="doc"><thead><tr><th>Date</th><th>Description</th><th class="r">Money out (${sym})</th><th class="r">Money in (${sym})</th><th class="r">Balance (${sym})</th><th>Check</th></tr></thead><tbody>${body || '<tr><td colspan="6" class="muted">No problem lines. Untick the box to see everything.</td></tr>'}</tbody></table></div></div>
  ${f.cur !== S.disp ? `<p class="muted small" style="margin-top:8px">Converted at 1 $ = ₹${S.rate}. The file itself is in ${f.cur === 'INR' ? 'rupees' : 'dollars'}.</p>` : ''}`;
}
function ledgerDoc(A, f, fi) {
  const only = !!SHOWONLY[fi]; const items = f.items.slice().sort((a, b) => a.date - b.date);
  const un = A.unpaid ? items.filter(i => A.unpaid.has(i.id)).length : 0;
  const body = items.filter(i => !only || (A.unpaid && A.unpaid.has(i.id))).map(i => {
    let st = '<span class="chip plain">Not checked yet</span>', cls = '';
    if (i.amount < 0) st = '<span class="chip plain">Credit note</span>';
    if (A.recon) { const p = A.paidBy[i.id]; if (p) st = `<span class="chip">Paid ${D(p.date)}</span>`; else if (A.unpaid.has(i.id)) { st = '<span class="chip warn">Unpaid</span>'; } }
    return `<tr class="${cls}" data-k="${esc(i.id)}"><td>${esc(i.id)}</td><td>${esc(i.customer)}</td><td class="n">${D(i.date)}</td><td class="n r">${plainNum(i.amount, f.cur)}</td><td>${st}</td></tr>`;
  }).join('');
  const sym = S.disp === 'INR' ? '₹' : '$';
  return `${docHead(f, fi, A.recon ? `<label><input type="checkbox" data-only="${fi}"${only ? ' checked' : ''}> Show only unpaid (${un})</label>` : '')}
  <div class="paper"><div class="papermeta"><span><b>${items.length}</b> invoices and credit notes</span><span><b>${new Set(items.map(i => i.customer)).size}</b> customers</span><span>Total billed <b>${M(items.reduce((a, i) => a + i.amount, 0), f.cur)}</b></span></div>
  <div class="scroll"><table class="doc"><thead><tr><th>No.</th><th>Customer</th><th>Date</th><th class="r">Amount (${sym})</th><th>Status</th></tr></thead><tbody>${body || '<tr><td colspan="5" class="muted">Nothing to show.</td></tr>'}</tbody></table></div></div>
  ${A.recon ? '' : '<p class="muted small" style="margin-top:8px">Add a bank statement and the status of each invoice fills in here.</p>'}`;
}
function sheetDoc(A, f, fi) {
  const g = f.grid, isG = A.g && A.g.fi === fi; const ncol = Math.max(...g.map(r => r.length)); const conv_ = f.cur !== S.disp;
  const head = '<tr><th class="rn"></th>' + Array.from({ length: ncol }, (_, c) => `<th>${colLetter(c)}</th>`).join('') + '</tr>';
  const body = g.map((row, r) => {
    const tot = /total/i.test(String(row[0] || '')) && r > 0;
    const tds = Array.from({ length: ncol }, (_, c) => {
      let v = row[c]; const isNum = c > 0 && r > 0 && v !== '' && v != null && !/[A-Za-z]/.test(String(v)) && E.parseMoney(v) != null; let txt = v == null ? '' : String(v);
      if (isNum) txt = conv_ ? plainNum(E.parseMoney(v), f.cur) : (typeof v === 'number' ? v.toLocaleString(S.disp === 'INR' ? 'en-IN' : 'en-US') : txt);
      const e = isG && A.footBy[r + '-' + c];
      return `<td class="${isNum ? 'num ' : ''}${e ? 'err' : ''}" data-k="${r}-${c}"${e ? ` title="Shows ${esc(M(e.shown, f.cur))}, adds up to ${esc(M(e.expect, f.cur))}"` : ''}>${esc(txt)}</td>`;
    }).join('');
    return `<tr class="${tot ? 'tot' : ''}"><th class="rn">${r + 1}</th>${tds}</tr>`;
  }).join('');
  const issues = isG ? A.foot.issues : [];
  return `${docHead(f, fi)}
  <div class="paper"><div class="scroll"><table class="sheet"><thead>${head}</thead><tbody>${body}</tbody></table></div>
  <div class="sheetnote">${isG ? (issues.length ? `<b>${issues.length} cell${issues.length > 1 ? 's' : ''} marked red</b> do not add up: ${issues.map(i => `<button class="link" data-go="${fi}|${i.r}-${i.c}">${colLetter(i.c)}${i.r + 1}</button>`).join(', ')}. Tap or hover a red cell to see what it should be.` : A.foot.checked ? 'Every total in this sheet adds up.' : 'I found no totals to check in this sheet.') : ''}${conv_ ? `<br><span class="muted">Numbers are shown converted at 1 $ = ₹${S.rate}. Only number cells (not the first column or row) are converted.</span>` : ''}</div></div>`;
}

// ---------- ask ----------
const SUG = ['How much is still unpaid?', 'Anything that does not add up?', 'Any payments made twice?', 'EMI for 12 lakh at 8.5% for 15 years', 'GST 18% on 2500'];
function askView() {
  const th = S.chat.map(m => `<div class="msg ${m.who}">${m.who === 'me' ? esc(m.text) : m.html}</div>`).join('');
  return `<div class="narrow"><h2>Ask about your files</h2><p class="muted small">Answers come from your files and say which part they used. If I cannot answer, I say so.</p><div class="thread" id="thread">${th}</div><div class="chips">${SUG.map(s => `<button data-s="${esc(s)}">${esc(s)}</button>`).join('')}</div>
  <form class="ask-in" id="askForm"><input type="text" id="askIn" placeholder="Ask anything about your files" aria-label="Ask anything about your files" autocomplete="off"><button class="primary" type="submit">Ask</button></form></div>`;
}
function ask(q) { S.chat.push({ who: 'me', text: q }); S.chat.push({ who: 'ai', html: answer(q, window.__A || analyze()) }); S.chat = S.chat.slice(-40); save(); nav('ask'); setTimeout(() => { const t = $('#thread'); if (t && t.lastChild) t.lastChild.scrollIntoView({ block: 'nearest' }); const i = $('#askIn'); if (i) i.focus({ preventScroll: true }); }, 0); }
const src = t => `<span class="src">Based on: ${t}</span>`;
function answer(q, A) {
  const t = q.toLowerCase(), rec = A.recon, bank = A.bank, items = A.items;
  const names = [...new Set(items.map(i => i.customer))]; const who = names.find(n => t.includes(n.toLowerCase()));
  if (/emi|loan/.test(t)) {
    const pr = t.match(/(\d[\d,]*(?:\.\d+)?)\s*(lakh|lac|crore|cr|k)?/), rate = t.match(/(\d+(?:\.\d+)?)\s*%/), yr = t.match(/(\d+(?:\.\d+)?)\s*(?:years?|yrs?|y\b)/), mo = t.match(/(\d+)\s*(?:months?|mos?)/);
    if (!pr || !rate || !(yr || mo)) return 'To work out an EMI I need the amount, the yearly rate and the time. For example: "EMI for 500000 at 9% for 5 years".';
    let p = parseFloat(pr[1].replace(/,/g, '')); const u = pr[2] || ''; if (/lakh|lac/.test(u)) p *= 1e5; else if (/crore|^cr$/.test(u)) p *= 1e7; else if (u === 'k') p *= 1e3;
    const months = mo ? +mo[1] : Math.round(parseFloat(yr[1]) * 12), L = E.loan(Math.round(p * 100), Math.round(parseFloat(rate[1]) * 100), months);
    return `A loan of ${M(Math.round(p * 100))} at ${rate[1]}% for ${months} months has an EMI of <b>${M(L.emi)}</b>. You would pay ${M(L.totInt)} interest, ${M(L.totPaid)} in all.${src('the standard EMI formula; the schedule repays exactly the loan amount' + (L.putBack ? '' : ' (CHECK FAILED)'))}`;
  }
  if (/gst/.test(t)) {
    const rate = t.match(/(\d+(?:\.\d+)?)\s*%/), am = t.replace(rate ? rate[0] : '', '').match(/(\d[\d,]*(?:\.\d+)?)/);
    if (!rate || !am) return 'Tell me the rate and the amount, for example "GST 18% on 2500". Add "inclusive" if the amount already has GST in it.';
    const g = E.gst(Math.round(parseFloat(am[1].replace(/,/g, '')) * 100), parseFloat(rate[1]), /inclusive|incl/.test(t), /igst|interstate|inter-state/.test(t));
    return `Price ${M(g.base)} + GST ${M(g.tax)} = <b>${M(g.total)}</b>${g.igst ? '' : ' (CGST ' + M(g.cgst) + ' + SGST ' + M(g.sgst) + ')'}.${src('the GST rate you gave, rounded to the nearest paisa')}`;
  }
  if (!bank.length && !items.length && !A.g) return 'There is nothing to look at yet. Add a file first, or ask for an EMI or GST calculation.';
  if (/unpaid|owe|outstanding|due|pending/.test(t)) {
    if (!rec) return 'To know what is unpaid I need both a bank statement and an invoice list in the same currency.';
    let o = rec.outstanding; if (who) o = o.filter(i => i.customer === who); const tot = o.reduce((a, i) => a + i.amount, 0);
    return `${who ? esc(who) + ' has ' : ''}<b>${M(tot)}</b> unpaid across ${o.length} invoice${o.length === 1 ? '' : 's'}.${rec.questions.length ? ' <i>I still have ' + rec.questions.length + ' question(s) for you, so this may change.</i>' : ''}${o.length ? '<br>' + o.slice(0, 6).map(i => esc(i.id) + ' – ' + esc(i.customer) + ' – ' + M(i.amount)).join('<br>') : ''}${src('invoices that no payment has been matched to')}`;
  }
  if (/twice|duplicate|repeat|double/.test(t)) {
    if (!rec) return 'I need a bank statement and an invoice list to spot repeated payments.';
    const u = rec.rows.filter(r => r.status === 'DUPLICATE' || (r.status === 'ASK' && /repeat/.test(r.note)));
    return u.length ? `I found ${u.length}:<br>${u.map(r => D(r.date) + ' – ' + M(r.amount) + ' – ' + esc(r.customer || '')).join('<br>')}${src('payments with the same date, amount and description')}` : 'No payment appears twice.';
  }
  if (/add up|wrong|error|mistake|balance|total|anything/.test(t)) {
    const f = findings(A); if (!f.length) return 'I found nothing wrong.';
    return `I found ${f.length} thing${f.length > 1 ? 's' : ''}:<br>${f.slice(0, 6).map(x => '• ' + x.h).join('<br>')}${f.length > 6 ? '<br>and ' + (f.length - 6) + ' more (see Overview)' : ''}${src('the checks in Overview')}`;
  }
  if (/received|money in|collected|income/.test(t)) { const cr = bank.filter(l => l.credit > 0); return `<b>${M(cr.reduce((a, l) => a + l.credit, 0))}</b> came in across ${cr.length} payments.${src('the bank statement')}`; }
  if (/spent|money out|expens|paid out|cost/.test(t)) { const dr = bank.filter(l => l.debit > 0); return `<b>${M(dr.reduce((a, l) => a + l.debit, 0))}</b> went out across ${dr.length} payments.${src('the bank statement')}`; }
  if (/how many/.test(t)) return `${bank.length} bank lines and ${items.length} invoices and credit notes.${src('your files')}`;
  return 'I cannot answer that from your file, and I will not guess. I can tell you what is unpaid, what was paid twice, what does not add up, how much came in or went out, and work out an EMI or GST.';
}

// ---------- wiring ----------
function toast(t) { const d = document.createElement('div'); d.className = 'note bad'; d.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:70;max-width:92%'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 6000); }
async function take(files) { for (const f of files) await readFile(f); S.answers = {}; S.key = null; save(); nav(S.files.length ? 'overview' : 'home'); }
function focusRow(fi, key) {
  nav('f' + fi); setTimeout(() => { const el = document.querySelector('[data-k="' + key + '"]'); if (!el) return; el.scrollIntoView({ block: 'center' }); el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 3500); }, 60);
}
function bindAll(A, v) {
  document.querySelectorAll('[data-nav]').forEach(b => b.onclick = () => nav(b.dataset.nav));
  document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => { const [fi, k] = b.dataset.go.split('|'); focusRow(+fi, k); });
  document.querySelectorAll('[data-sample]').forEach(b => b.onclick = () => loadSample(b.dataset.sample));
  const d = $('#drop'); if (d) { d.onclick = () => $('#file').click(); d.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $('#file').click(); } }; }
  const af = $('#addFile'); if (af) af.onclick = () => $('#file').click();
  const cl = $('#clear'); if (cl) cl.onclick = resetAll;
  document.querySelectorAll('[data-del]').forEach(b => b.onclick = () => { S.files.splice(+b.dataset.del, 1); S.answers = {}; S.key = null; save(); nav(S.files.length ? 'overview' : 'home'); });
  document.querySelectorAll('select[data-k]').forEach(s => s.onchange = () => { const f = S.files[+s.dataset.k]; if (RAW[f.name]) applyKind(f, RAW[f.name], f.header || 0, s.value); else toast('Sample files cannot change type. Upload your own file to try this.'); S.answers = {}; save(); render(); });
  document.querySelectorAll('select[data-cur]').forEach(s => s.onchange = () => { S.files[+s.dataset.cur].cur = s.value; save(); render(); });
  document.querySelectorAll('input[data-only]').forEach(c => c.onchange = () => { SHOWONLY[+c.dataset.only] = c.checked; render(); });
  document.querySelectorAll('button[data-oi]').forEach(b => b.onclick = () => answerQ(A, +b.dataset.qi, +b.dataset.oi));
  document.querySelectorAll('select[data-qi]').forEach(s => s.onchange = () => { if (s.value !== '') answerQ(A, +s.dataset.qi, +s.value); });
  const cp = $('#copy'); if (cp) cp.onclick = () => copySummary(A, cp);
  const af2 = $('#askForm'); if (af2) af2.onsubmit = e => { e.preventDefault(); const t = $('#askIn').value.trim(); if (t) ask(t); };
  document.querySelectorAll('[data-s]').forEach(b => b.onclick = () => ask(b.dataset.s));
}
function answerQ(A, qi, oi) { const q = A.recon.questions[qi], o = q.options[oi]; (S.answers[q.pay] = S.answers[q.pay] || {})[q.kind] = o.value; save(); render(); }
function copySummary(A, btn) {
  const sm = summaryLines(A), fi = findings(A).map(x => '- ' + x.t + ': ' + x.h.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim());
  const text = 'Zygon Cognition Finance summary\n' + sm.head + '\n' + sm.facts.map(([v, l]) => v + ' ' + l).join(', ') + '\n\n' + (fi.join('\n') || 'Nothing wrong found.');
  const done = () => { btn.textContent = 'Copied'; setTimeout(() => btn.textContent = 'Copy summary', 2000); };
  try { navigator.clipboard.writeText(text).then(done, () => { btn.textContent = 'Copy not allowed here'; }); } catch (e) { btn.textContent = 'Copy not allowed here'; }
}
function resetAll() { S = Object.assign(S, { files: [], answers: {}, chat: [], key: null }); try { localStorage.removeItem(KEY); } catch (e) { } nav('home'); }
$('#back').onclick = () => nav('home');
$('#file').onchange = e => { take(e.target.files); e.target.value = ''; };
// Drag and drop. The overlay only appears for real files, never blocks clicks, and always goes away.
let ovTimer = null;
const hideOv = () => { $('#dropov').hidden = true; clearTimeout(ovTimer); };
const hasFiles = e => e.dataTransfer && [...e.dataTransfer.types].includes('Files');
window.addEventListener('dragover', e => { e.preventDefault(); if (hasFiles(e)) { $('#dropov').hidden = false; clearTimeout(ovTimer); ovTimer = setTimeout(hideOv, 400); } });
window.addEventListener('dragend', hideOv); window.addEventListener('blur', hideOv);
window.addEventListener('keydown', e => { if (e.key === 'Escape') hideOv(); });
window.addEventListener('drop', e => {
  e.preventDefault(); hideOv();
  const s = e.dataTransfer.getData('text/x-zygon-sample');
  if (s) { loadSample(s); return; }
  if (e.dataTransfer.files.length) take(e.dataTransfer.files);
});
// samples can be dragged into the drop box too
document.addEventListener('dragstart', e => { const b = e.target.closest && e.target.closest('[data-sample]'); if (b) { e.dataTransfer.setData('text/x-zygon-sample', b.dataset.sample); e.dataTransfer.effectAllowed = 'copy'; } });
document.addEventListener('dragover', e => { const z = e.target.closest && e.target.closest('#drop'); if (z) z.classList.add('over'); });
document.addEventListener('dragleave', e => { const z = e.target.closest && e.target.closest('#drop'); if (z && !z.contains(e.relatedTarget)) z.classList.remove('over'); });
load(); render();
</script>
