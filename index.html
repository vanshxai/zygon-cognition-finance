<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zygon Cognition Finance</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Chat-first finance assistant. Left: chats and files. Centre: conversation of result cards. Right: the open document. */
:root{
  --bg:#f3f6f5; --surface:#ffffff; --surface2:#edf2f1; --ink:#112220; --muted:#5a6d6b; --line:#dbe4e2;
  --accent:#0d6b5b; --accent-ink:#ffffff; --accent-soft:#e0f0ec; --gold:#c9961f; --gold-ink:#4a3300; --out:#a3b3b1;
  --ask:#8f4d00; --ask-bg:#fff2dc; --bad:#aa2a1f; --bad-bg:#fdeae7; --good:#1b7243; --good-bg:#e4f4ea; --shadow:0 10px 30px -18px rgba(10,40,35,.35);
  --font:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1514; --surface:#142120; --surface2:#1a2b29; --ink:#e5efee; --muted:#93a8a6; --line:#26393a;
  --accent:#4cc2ab; --accent-ink:#04201a; --accent-soft:#16332e; --gold:#e3b04b; --gold-ink:#3b2a00; --out:#5f7775;
  --ask:#f2b45f; --ask-bg:#3a2a0f; --bad:#ff9087; --bad-bg:#3b1b18; --good:#72d49c; --good-bg:#12301f; --shadow:0 10px 30px -18px rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1514; --surface:#142120; --surface2:#1a2b29; --ink:#e5efee; --muted:#93a8a6; --line:#26393a;
  --accent:#4cc2ab; --accent-ink:#04201a; --accent-soft:#16332e; --gold:#e3b04b; --gold-ink:#3b2a00; --out:#5f7775;
  --ask:#f2b45f; --ask-bg:#3a2a0f; --bad:#ff9087; --bad-bg:#3b1b18; --good:#72d49c; --good-bg:#12301f; --shadow:0 10px 30px -18px rgba(0,0,0,.7); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55;overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:80}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:272px minmax(0,1fr);grid-template-rows:minmax(0,1fr);height:100%;padding-top:env(safe-area-inset-top,0px)}
.app.collapsed{grid-template-columns:0 minmax(0,1fr)}
/* sidebar */
.side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 12px 12px max(12px,env(safe-area-inset-left,0px));overflow:hidden;min-width:0}
.app.collapsed .side{padding:0;border:0;visibility:hidden}
.logo{font-weight:600;font-size:18px;letter-spacing:-.01em;padding:2px 8px 14px;line-height:1.2}
.logo b{color:var(--accent);font-weight:600}
.newchat{border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:10px 12px;text-align:left;font-weight:500}
.newchat:hover{border-color:var(--accent)}
.sidelabel{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:18px 10px 6px;font-weight:600}
.list{overflow:auto;display:flex;flex-direction:column;gap:2px;min-height:0}
.list.grow{flex:1}
.item{position:relative;display:flex;gap:8px;align-items:center;width:100%;border:0;background:none;text-align:left;padding:8px 26px 8px 10px;border-radius:8px;color:var(--muted);font-size:14px}
.item:hover{background:var(--surface2);color:var(--ink)}
.item.on{background:var(--surface2);color:var(--ink);box-shadow:inset 3px 0 0 var(--accent)}
.item span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.item .x{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--muted);opacity:0;font-size:16px;padding:0 4px}
.item:hover .x{opacity:1}
.fico{flex:none;width:22px;height:22px;border-radius:5px;display:grid;place-items:center;font-size:11px;font-weight:600;background:var(--accent-soft);color:var(--accent)}
.sidefoot{font-size:12px;color:var(--muted);padding:10px 8px 2px;border-top:1px solid var(--line);margin-top:8px}
/* main */
main{display:flex;flex-direction:column;min-width:0;height:100%}
.top{display:flex;align-items:center;gap:8px;padding:8px max(14px,env(safe-area-inset-right,0px)) 8px 10px;border-bottom:1px solid var(--line);background:var(--bg)}
.top h1{font-size:15px;font-weight:600;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.icon{width:38px;height:38px;flex:none;border-radius:10px;border:1px solid transparent;background:none;color:var(--muted);display:grid;place-items:center}
.icon:hover{background:var(--surface2);color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none}
.seg button{border:0;border-radius:0;background:var(--surface);padding:6px 11px;font-weight:500;color:var(--muted);font-size:13.5px}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
.rate{display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--muted);flex:none}
.rate input{width:66px;padding:5px 7px;font-family:var(--mono);background:var(--surface);border:1px solid var(--line);border-radius:8px}
.body{flex:1;min-height:0;display:flex}
.stage{flex:1;min-width:0;overflow-y:auto;padding:18px max(18px,env(safe-area-inset-right,0px)) 18px 18px;scroll-behavior:smooth}
.col{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
/* welcome */
.welcome{text-align:center;padding:5vh 0 10px}
.welcome .brand{font-size:clamp(30px,6vw,46px);font-weight:600;letter-spacing:-.025em;line-height:1.1}
.welcome .brand b{color:var(--accent)}
.welcome p{color:var(--muted);margin:12px auto 26px;max-width:520px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;text-align:left;max-width:760px;margin:0 auto}
.tile{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:13px 15px;display:flex;flex-direction:column;gap:3px}
.tile:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.tile b{font-weight:600;font-size:14.5px}.tile span{font-size:13px;color:var(--muted)}
/* turns */
.you{align-self:flex-end;max-width:85%;background:var(--accent);color:var(--accent-ink);padding:9px 14px;border-radius:14px 14px 4px 14px;overflow-wrap:anywhere}
.ai{display:flex;gap:12px;align-items:flex-start;min-width:0}
.mark{flex:none;width:30px;height:30px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:600;font-size:15px;margin-top:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);min-width:0;flex:1;animation:rise .3s ease both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card h3{margin:0 0 6px;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.card p{margin:0 0 8px}
.big{font-size:19px;line-height:1.35;font-weight:600;letter-spacing:-.01em;margin:0 0 6px;text-wrap:balance}
.muted{color:var(--muted)} .small{font-size:14px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.facts{display:flex;flex-wrap:wrap;gap:6px 24px;margin:10px 0 4px}
.fact b{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:19px;display:block;line-height:1.2}
.fact span{font-size:13px;color:var(--muted)}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 12px;font-size:14px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:500}
.link{border:0;background:none;padding:0;color:var(--accent);text-decoration:underline;text-underline-offset:3px;font-size:inherit}
.q{border:1px solid var(--ask);background:var(--ask-bg);border-radius:12px;padding:13px 15px;margin-top:10px}
.q h4{margin:0 0 2px;font-size:15px;font-weight:600}
.q p{color:var(--ask);font-size:14px}
.opt{display:block;width:100%;text-align:left;margin-top:7px;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px 12px;overflow-wrap:anywhere;font-size:14px}
.opt:hover{border-color:var(--accent)}
.q select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.find{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.find:last-child{border-bottom:0}.find>div{min-width:0;overflow-wrap:anywhere;flex:1;font-size:14.5px}
.tag{flex:none;font-size:12px;font-weight:600;padding:2px 9px;border-radius:10px;margin-top:2px;white-space:nowrap}
.tag.bad{background:var(--bad-bg);color:var(--bad)}.tag.warn{background:var(--ask-bg);color:var(--ask)}.tag.good{background:var(--good-bg);color:var(--good)}
.note{border-radius:10px;padding:9px 13px;font-size:14px;margin-top:8px}
.note.bad{background:var(--bad-bg);color:var(--bad)}.note.warn{background:var(--ask-bg);color:var(--ask)}.note.good{background:var(--good-bg);color:var(--good)}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted);margin-bottom:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
svg.chart{display:block;width:100%;height:auto}.axis{fill:var(--muted);font-size:11px;font-family:var(--font)}
.hbar{display:grid;grid-template-columns:minmax(80px,140px) 1fr auto;gap:10px;align-items:center;font-size:14px;margin:7px 0}
.hbar .t{height:11px;background:var(--accent-soft);border-radius:6px;overflow:hidden}.hbar .t i{display:block;height:100%;background:var(--accent);border-radius:6px}
.hbar .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px;margin-top:8px}
table.doc{border-collapse:collapse;width:100%;font-size:13.5px}
table.doc th{position:sticky;top:0;background:var(--surface);z-index:2;text-align:left;font-size:12px;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px 11px;border-bottom:2px solid var(--line);white-space:nowrap}
table.doc td{padding:7px 11px;border-bottom:1px solid var(--line);vertical-align:top}
table.doc td.r,table.doc th.r{text-align:right}table.doc td.n{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
table.doc tr:nth-child(even) td{background:color-mix(in srgb,var(--bg) 55%,transparent)}
tr.bad td{background:var(--bad-bg)!important}tr.warn td{background:var(--ask-bg)!important}
tr.flash td,td.flash{outline:2px solid var(--accent);outline-offset:-2px}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:9px;background:var(--good-bg);color:var(--good);overflow-wrap:anywhere}
.chip.bad{background:var(--bad-bg);color:var(--bad)}.chip.warn{background:var(--ask-bg);color:var(--ask)}.chip.plain{background:var(--accent-soft);color:var(--muted)}
.chip button{all:unset;cursor:pointer;text-decoration:underline}
table.sheet{border-collapse:collapse;font-size:13.5px;min-width:100%}
table.sheet th{position:sticky;top:0;background:var(--surface2);color:var(--muted);font-weight:500;font-size:12px;border:1px solid var(--line);padding:3px 10px;text-align:center;z-index:2}
table.sheet th.rn{position:sticky;left:0;z-index:3;width:40px;min-width:40px}
table.sheet td{border:1px solid var(--line);padding:4px 10px;white-space:nowrap;background:var(--surface)}table.sheet td.num{text-align:right;font-family:var(--mono)}
table.sheet tr.tot td{font-weight:600;background:var(--surface2)}
table.sheet td.err{background:var(--bad-bg)!important;color:var(--bad);box-shadow:inset 0 0 0 2px var(--bad);cursor:help}
details{margin-top:10px}summary{cursor:pointer;color:var(--muted);font-size:14px}
pre{font-family:var(--mono);font-size:12.5px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:260px;overflow:auto;margin:8px 0 0}
/* finance loader: candlesticks and a spinning rupee coin */
.loader{display:flex;align-items:flex-end;gap:16px;padding:4px 2px}
.candles{display:flex;gap:7px;align-items:flex-end;height:56px}
.candles i{position:relative;width:9px;border-radius:2px;background:var(--good);height:16px;animation:cd 1.3s ease-in-out infinite}
.candles i.dn{background:var(--bad)}
.candles i::before{content:"";position:absolute;left:50%;top:-9px;bottom:-9px;width:2px;margin-left:-1px;background:inherit;opacity:.55;z-index:-1}
.candles i:nth-child(1){animation-delay:0s}.candles i:nth-child(2){animation-delay:.15s}.candles i:nth-child(3){animation-delay:.3s}.candles i:nth-child(4){animation-delay:.45s}.candles i:nth-child(5){animation-delay:.6s}.candles i:nth-child(6){animation-delay:.75s}.candles i:nth-child(7){animation-delay:.9s}.candles i:nth-child(8){animation-delay:1.05s}
@keyframes cd{0%,100%{height:14px}50%{height:40px}}
.coin{flex:none;width:36px;height:36px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe9a8,var(--gold) 60%);color:var(--gold-ink);display:grid;place-items:center;font-weight:700;font-size:17px;box-shadow:inset 0 0 0 3px rgba(0,0,0,.12);animation:flip 1.6s linear infinite}
@keyframes flip{to{transform:rotateY(360deg)}}
.lstep{font-size:14px;color:var(--muted);align-self:center}
.lstep b{color:var(--ink);font-weight:500}
@media (prefers-reduced-motion:reduce){.candles i,.coin,.card{animation:none}}
/* composer */
.composer{padding:8px max(14px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));background:linear-gradient(transparent,var(--bg) 22%)}
.cin{max-width:780px;margin:0 auto;position:relative}
.sugpop{position:absolute;left:0;right:0;bottom:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;z-index:5}
.sugpop button{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 14px;font-size:14.5px;border-bottom:1px solid var(--line)}
.sugpop button:last-child{border-bottom:0}.sugpop button:hover,.sugpop button.on{background:var(--accent-soft)}
.sugpop mark{background:none;color:var(--accent);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.fchip{display:inline-flex;gap:6px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:3px 10px;font-size:13px}
.box{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px 8px 6px 6px;box-shadow:var(--shadow)}
.box:focus-within{border-color:var(--accent)}
.field{position:relative;flex:1;min-width:0}
.field input,.field .ghost{width:100%;font-size:16px;padding:9px 6px;border:0;background:none;outline:0;font-family:var(--font);line-height:1.4}
.field .ghost{position:absolute;inset:0;pointer-events:none;color:var(--muted);opacity:.65;white-space:pre;overflow:hidden}
.field .ghost .t{visibility:hidden}
.field input{position:relative}
.send{width:40px;height:40px;border-radius:12px;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.send:disabled{opacity:.45}
.hint{max-width:780px;margin:6px auto 0;font-size:12px;color:var(--muted);text-align:center}
kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 5px;background:var(--surface)}
/* document drawer */
.drawer{width:min(54vw,720px);flex:none;border-left:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;min-width:0}
.dhead{display:flex;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.dhead .tabs{flex:1;display:flex;gap:6px;overflow-x:auto}
.dtab{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 11px;font-size:13.5px;white-space:nowrap}
.dtab[aria-selected=true]{background:var(--accent-soft);border-color:var(--accent);font-weight:600}
.dbody{flex:1;overflow:auto;padding:14px}
.dtools{display:flex;gap:12px;flex-wrap:wrap;align-items:center;font-size:13.5px;margin:0 0 10px}
.dtools select{padding:4px 7px;border:1px solid var(--line);border-radius:7px;background:var(--surface)}
.papermeta{display:flex;flex-wrap:wrap;gap:4px 22px;padding:10px 2px 12px;font-size:13px;color:var(--muted)}.papermeta b{font-family:var(--mono);font-weight:500;color:var(--ink)}
.dropov{pointer-events:none;position:fixed;inset:0;z-index:90;background:color-mix(in srgb,var(--accent) 16%,transparent);display:grid;place-items:center;font-size:22px;font-weight:600;backdrop-filter:blur(2px)}
.scrim{display:none}
@media (max-width:900px){
  .drawer{position:fixed;inset:0;width:auto;z-index:70;padding-top:env(safe-area-inset-top,0px)}
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:0;bottom:0;width:284px;z-index:60;transform:translateX(-102%);transition:transform .2s;padding-top:calc(16px + env(safe-area-inset-top,0px))}
  .app.open .side{transform:none;box-shadow:var(--shadow)}
  .app.open .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:55}
  .app.collapsed{grid-template-columns:minmax(0,1fr)}.app.collapsed .side{visibility:visible;padding:16px 12px}
  .rate .l{display:none}
}
@media (max-width:560px){.seg button{padding:5px 8px}.top .rate{display:none}.you{max-width:92%}.stage{padding-left:12px}.mark{display:none}}
</style>

<div class="app" id="app">
  <aside class="side" id="side">
    <div class="logo">Zygon <b>Cognition</b><br>Finance</div>
    <button class="newchat" id="newchat">＋ New chat</button>
    <div class="sidelabel">Recent</div>
    <div class="list grow" id="chatlist"></div>
    <div class="sidelabel" id="fileslabel">Files in this chat</div>
    <div class="list" id="filelist"></div>
    <div class="sidefoot">Files are read in this browser. Nothing is sent to a server.</div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <main>
    <header class="top">
      <button class="icon" id="menu" aria-label="Show or hide the chat list"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <h1 id="title">New chat</h1>
      <span class="seg" role="group" aria-label="Show amounts in"><button data-c="INR" aria-pressed="true">&#8377; Rupees</button><button data-c="USD" aria-pressed="false">$ Dollars</button></span>
      <label class="rate"><span class="l">1 $ = &#8377;</span><input type="number" id="rate" min="0.01" step="0.01" aria-label="Rupees per dollar"></label>
      <button class="icon" id="theme" aria-label="Switch light or dark"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
    </header>
    <div class="body">
      <section class="stage" id="stage" aria-live="polite"></section>
      <aside class="drawer" id="drawer" hidden></aside>
    </div>
    <footer class="composer">
      <div class="cin">
        <div class="sugpop" id="pop" hidden></div>
        <div class="chips" id="fchips"></div>
        <div class="box">
          <button class="icon" id="attach" aria-label="Attach a file" title="Attach a bank statement, invoice list or spreadsheet"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5l-8.6 8.6a5.5 5.5 0 01-7.8-7.8l8.6-8.6a3.7 3.7 0 015.2 5.2l-8.6 8.6a1.8 1.8 0 01-2.6-2.6l7.9-7.9"/></svg></button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
// Zygon Finance engine. Plain JS, no libraries. All money = whole paise (integers).
// RULE: the engine never guesses. If more than one answer fits, it makes a QUESTION and waits.
const Engine = (function () {
  // ---------- money / dates ----------
  function parseMoney(s) {
    if (typeof s === 'number') return Math.round(s * 100);
    s = String(s == null ? '' : s).trim();
    if (!s) return null;
    const neg = /^\(.*\)$/.test(s) || /^-/.test(s) || /-$/.test(s);
    const clean = s.replace(/[^0-9.]/g, '');
    if (!/[0-9]/.test(clean)) return null;
    const parts = clean.split('.');
    const whole = parseInt(parts[0] || '0', 10);
    const frac = parseInt(((parts[1] || '') + '00').slice(0, 2), 10);
    const v = whole * 100 + frac;
    return neg ? -v : v;
  }
  const MON = { jan: 0, feb: 1, mar: 2, apr: 3, may: 4, jun: 5, jul: 6, aug: 7, sep: 8, oct: 9, nov: 10, dec: 11 };
  function dayNum(y, m, d) { return Math.round(Date.UTC(y, m, d) / 86400000); }
  function parseDate(s) {
    if (s == null || s === '') return null;
    if (typeof s === 'number') { // Excel serial date
      if (s > 20000 && s < 80000) return Math.round(s - 25569);
      return null;
    }
    s = String(s).trim();
    let m;
    if ((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return dayNum(+m[1], m[2] - 1, +m[3]);
    if ((m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/))) {
      let y = +m[3]; if (y < 100) y += 2000;
      return dayNum(y, m[2] - 1, +m[1]); // day first (Indian statements)
    }
    if ((m = s.match(/^(\d{1,2})[\s\-]([A-Za-z]{3})[a-z]*[\s\-,]*(\d{2,4})/))) {
      let y = +m[3]; if (y < 100) y += 2000;
      const mo = MON[m[2].toLowerCase()];
      if (mo !== undefined) return dayNum(y, mo, +m[1]);
    }
    return null;
  }
  function fmtDate(n) {
    if (n == null) return '';
    const d = new Date(n * 86400000);
    return String(d.getUTCDate()).padStart(2, '0') + '-' + String(d.getUTCMonth() + 1).padStart(2, '0') + '-' + d.getUTCFullYear();
  }
  let fmtHook = null;
  function fmtMoney(p) { return fmtHook ? fmtHook(p) : fmtINR(p); }
  function setFmt(fn) { fmtHook = fn; }
  function fmtINR(p) { // Indian digit grouping: 12,34,567.89
    const neg = p < 0; p = Math.abs(p);
    const r = Math.floor(p / 100), f = String(p % 100).padStart(2, '0');
    let s = String(r);
    if (s.length > 3) {
      const last = s.slice(-3); let rest = s.slice(0, -3);
      rest = rest.replace(/\B(?=(\d{2})+(?!\d))/g, ',');
      s = rest + ',' + last;
    }
    return (neg ? '-' : '') + '₹' + s + '.' + f;
  }
  function divRound(a, b) { // round half up, integers only
    return Math.floor((2 * a + b) / (2 * b));
  }

  // ---------- CSV ----------
  function parseCSV(text) {
    const rows = []; let row = [], cur = '', q = false;
    text = text.replace(/^﻿/, '');
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (q) {
        if (c === '"' && text[i + 1] === '"') { cur += '"'; i++; }
        else if (c === '"') q = false;
        else cur += c;
      } else if (c === '"') q = true;
      else if (c === ',') { row.push(cur); cur = ''; }
      else if (c === '\n' || c === '\r') {
        if (c === '\r' && text[i + 1] === '\n') i++;
        row.push(cur); cur = '';
        if (row.some(x => x.trim() !== '')) rows.push(row);
        row = [];
      } else cur += c;
    }
    row.push(cur);
    if (row.some(x => x.trim() !== '')) rows.push(row);
    return rows;
  }

  // ---------- reading tables into bank lines / invoices ----------
  function findCol(head, pats) {
    for (let i = 0; i < head.length; i++) for (const p of pats) if (p.test(head[i])) return i;
    return -1;
  }
  function detectKind(rows) {
    if (!rows.length) return 'sheet';
    const head = rows[0].map(x => String(x).toLowerCase());
    const has = p => findCol(head, [p]) >= 0;
    if ((has(/debit|withdraw/) || has(/credit|deposit/)) && has(/balance/)) return 'bank';
    if (has(/invoice|inv\s*no|bill/) && has(/customer|party|client|name/)) return 'ledger';
    if (has(/customer|party|client/) && has(/amount|total|value/)) return 'ledger';
    return 'sheet';
  }
  function readBank(rows) {
    const warn = [];
    const head = rows[0].map(x => String(x).toLowerCase());
    const iD = findCol(head, [/^date|txn date|value date|tran date/]);
    const iT = findCol(head, [/narration|description|particular|details|remark/]);
    const iDr = findCol(head, [/debit|withdraw|dr\b/]);
    const iCr = findCol(head, [/credit|deposit|cr\b/]);
    const iB = findCol(head, [/balance/]);
    const lines = [];
    let skipped = 0;
    for (let r = 1; r < rows.length; r++) {
      const x = rows[r];
      const date = parseDate(x[iD]);
      if (date == null) { skipped++; continue; }
      const dr = iDr >= 0 ? (parseMoney(x[iDr]) || 0) : 0;
      const cr = iCr >= 0 ? (parseMoney(x[iCr]) || 0) : 0;
      lines.push({ id: 'B' + String(lines.length + 1).padStart(4, '0'), date, desc: String(x[iT] || '').trim(),
        debit: Math.abs(dr), credit: Math.abs(cr), balance: iB >= 0 ? parseMoney(x[iB]) : null });
    }
    if (skipped) warn.push(skipped + ' row(s) skipped because the date could not be read');
    if (iD < 0 || iT < 0) warn.push('Could not find a date or description column');
    return { lines, warn };
  }
  function readLedger(rows) {
    const warn = [];
    const head = rows[0].map(x => String(x).toLowerCase());
    const iId = findCol(head, [/invoice|inv\s*no|bill|^id$|doc/]);
    const iC = findCol(head, [/customer|party|client|name/]);
    const iD = findCol(head, [/date/]);
    const iA = findCol(head, [/amount|total|value/]);
    const iType = findCol(head, [/type/]);
    const items = []; let skipped = 0;
    for (let r = 1; r < rows.length; r++) {
      const x = rows[r];
      let amt = parseMoney(x[iA]); const date = parseDate(x[iD]); const cust = String(x[iC] || '').trim();
      if (amt == null || date == null || !cust) { skipped++; continue; }
      const t = iType >= 0 ? String(x[iType]).toLowerCase() : '';
      if (/credit/.test(t) && amt > 0) amt = -amt;
      items.push({ id: String(x[iId] || 'ROW' + r).trim(), customer: cust, date, amount: amt });
    }
    if (skipped) warn.push(skipped + ' row(s) skipped (missing date, amount or customer)');
    return { items, warn };
  }

  // ---------- bank balance audit ----------
  function auditBank(lines) {
    const errors = []; let prev = null;
    for (const l of lines) {
      if (l.balance == null) continue;
      if (prev != null) {
        const expect = prev + l.credit - l.debit;
        if (expect !== l.balance) {
          errors.push({ id: l.id, date: l.date, desc: l.desc, expect, shown: l.balance, diff: l.balance - expect });
          prev = expect; // keep the true running value so one typo = one alarm
          continue;
        }
      }
      prev = l.balance;
    }
    return errors;
  }

  // ---------- reconciliation: never guesses ----------
  function findCombos(pool, target, maxSize) {
    const out = [];
    (function rec(start, size, sum, chosen) {
      if (size > 0 && sum === target) out.push(chosen.slice());
      if (size === maxSize) return;
      for (let i = start; i < pool.length; i++) {
        chosen.push(pool[i]); rec(i + 1, size + 1, sum + pool[i].amount, chosen); chosen.pop();
      }
    })(0, 0, 0, []);
    return out;
  }
  function findNear(pool, target, maxSize, maxDiff) {
    const out = [];
    (function rec(start, size, sum, chosen) {
      const d = sum - target;
      if (size > 0 && d > 0 && d <= maxDiff) out.push({ combo: chosen.slice(), diff: d });
      if (size === maxSize) return;
      for (let i = start; i < pool.length; i++) {
        chosen.push(pool[i]); rec(i + 1, size + 1, sum + pool[i].amount, chosen); chosen.pop();
      }
    })(0, 0, 0, []);
    out.sort((a, b) => a.diff - b.diff || a.combo.length - b.combo.length);
    return out.slice(0, 4);
  }
  const POOL_CAP = 18;

  // payments: [{id,date,desc,amount,customer?}]  items: invoices (+) and credit notes (-)
  // answers: { payId: {dup:bool, party:name, pick:[ids] | 'none', near:[ids] | 'none'} }
  function reconcile(payments, items, answers) {
    answers = answers || {};
    const trail = [], questions = [], rows = [];
    const names = [...new Set(items.map(i => i.customer))];
    const open = {};
    items.slice().sort((a, b) => a.date - b.date || (a.id < b.id ? -1 : 1))
      .forEach(i => (open[i.customer] = open[i.customer] || []).push(i));
    const blocked = {}; // customer -> payment id that is waiting for an answer
    const seen = {};
    const log = m => trail.push(m);
    const label = i => i.id + ' (' + fmtDate(i.date) + ', ' + fmtMoney(i.amount) + ')';
    const optionsFor = combos => combos.map(c => ({ label: c.map(label).join('  +  '), value: c.map(i => i.id) }));

    function detectParty(p) {
      if (p.customer) return p.customer;
      const d = (p.desc || '').toLowerCase();
      let best = null;
      for (const n of names) if (d.includes(n.toLowerCase()) && (!best || n.length > best.length)) best = n;
      return best;
    }

    const sorted = payments.slice().sort((a, b) => a.date - b.date || (a.id < b.id ? -1 : 1));
    for (const p of sorted) {
      const row = { id: p.id, date: p.date, desc: p.desc || '', amount: p.amount, customer: null, status: '', ids: [], note: '', diff: 0 };
      rows.push(row);
      const ans = answers[p.id] || {};
      let cust = detectParty(p);

      // 1. same date + amount + description seen before -> ask, never assume
      const key = p.date + '|' + p.amount + '|' + (p.desc || '').toLowerCase();
      if (seen[key] && ans.dup === undefined) {
        row.customer = cust; row.status = 'ASK';
        row.note = 'Looks like a repeat of ' + seen[key];
        questions.push({ pay: p.id, kind: 'dup', title: p.id + ': possible duplicate',
          text: fmtMoney(p.amount) + ' on ' + fmtDate(p.date) + ' (' + (p.desc || 'no description') + ') appears twice. Is the second one a duplicate?',
          options: [{ label: 'Yes, it is a duplicate (ignore it)', value: true }, { label: 'No, it is a real second payment', value: false }] });
        if (cust) blocked[cust] = blocked[cust] || p.id;
        log(p.id + ' ASK duplicate? same as ' + seen[key]);
        continue;
      }
      if (!seen[key]) seen[key] = p.id;
      if (ans.dup === true) { row.customer = cust; row.status = 'DUPLICATE'; row.note = 'You confirmed this is a duplicate'; log(p.id + ' DUPLICATE (confirmed by user)'); continue; }

      // 2. who paid?
      if (!cust && ans.party) cust = ans.party;
      if (!cust) {
        row.status = 'ASK'; row.note = 'Payer not recognised';
        questions.push({ pay: p.id, kind: 'party', title: p.id + ': who paid this?',
          text: fmtMoney(p.amount) + ' on ' + fmtDate(p.date) + ' ("' + (p.desc || '') + '"). I could not find a customer name in the description.',
          options: names.map(n => ({ label: n, value: n })) });
        log(p.id + ' ASK payer unknown');
        continue;
      }
      row.customer = cust;

      // 3. earlier question for this customer still open -> wait, do not build on a guess
      if (blocked[cust]) { row.status = 'WAITING'; row.note = 'Waiting for your answer on ' + blocked[cust]; log(p.id + ' WAITING on ' + blocked[cust]); continue; }

      let pool = (open[cust] || []).filter(i => i.date <= p.date);
      if (pool.length > POOL_CAP) { log(p.id + ' note: ' + pool.length + ' open items, searched newest ' + POOL_CAP); pool = pool.slice(-POOL_CAP); }
      const take = ids => {
        const set = new Set(ids);
        open[cust] = open[cust].filter(i => !set.has(i.id));
        row.ids = ids.slice();
      };

      // user already answered a pick/near question for this payment
      if (ans.pick === 'none') { row.status = 'UNMATCHED'; row.note = 'You said none of the options is right'; log(p.id + ' UNMATCHED (user)'); continue; }
      if (Array.isArray(ans.pick)) { take(ans.pick); row.status = 'CONFIRMED'; row.note = 'You chose this match'; log(p.id + ' CONFIRMED by user: ' + ans.pick.join(', ')); continue; }
      if (ans.near === 'none') { row.status = 'UNMATCHED'; row.note = 'You said it is not a short payment'; log(p.id + ' UNMATCHED (user)'); continue; }
      if (Array.isArray(ans.near)) {
        const set = new Set(ans.near);
        const sum = (open[cust] || []).filter(i => set.has(i.id)).reduce((a, i) => a + i.amount, 0);
        row.diff = sum - p.amount; take(ans.near); row.status = 'SHORT';
        row.note = 'Paid ' + fmtMoney(row.diff) + ' less than billed (you accepted)'; log(p.id + ' SHORT ' + fmtMoney(row.diff) + ' (user accepted)'); continue;
      }

      const hits = findCombos(pool, p.amount, 4);
      if (hits.length === 1) {
        take(hits[0].map(i => i.id)); row.status = 'CERTAIN';
        row.note = 'Only one combination adds up exactly'; log(p.id + ' CERTAIN: ' + row.ids.join(' + ') + ' = ' + fmtMoney(p.amount));
      } else if (hits.length > 1) {
        row.status = 'ASK'; row.note = hits.length + ' combinations fit exactly';
        questions.push({ pay: p.id, kind: 'pick', title: p.id + ': which invoices did this pay?',
          text: cust + ' paid ' + fmtMoney(p.amount) + ' on ' + fmtDate(p.date) + '. ' + hits.length + ' different sets of invoices add up to exactly this.',
          options: optionsFor(hits.slice(0, 8)).concat([{ label: 'None of these', value: 'none' }]) });
        blocked[cust] = p.id; log(p.id + ' ASK pick: ' + hits.length + ' exact fits');
      } else {
        const near = findNear(pool, p.amount, 3, 10000);
        if (near.length) {
          row.status = 'ASK'; row.note = 'No exact fit; close to a bill';
          questions.push({ pay: p.id, kind: 'near', title: p.id + ': possible short payment',
            text: cust + ' paid ' + fmtMoney(p.amount) + '. No invoices add up exactly, but these are within ₹100 above it (a bank fee or small deduction?).',
            options: near.map(n => ({ label: n.combo.map(label).join('  +  ') + '   (short by ' + fmtMoney(n.diff) + ')', value: n.combo.map(i => i.id) })).concat([{ label: 'No, not a short payment', value: 'none' }]) });
          blocked[cust] = p.id; log(p.id + ' ASK near-match');
        } else {
          row.status = 'UNMATCHED'; row.note = 'No invoices add up to this amount (advance, or an invoice is missing)';
          log(p.id + ' UNMATCHED ' + fmtMoney(p.amount));
        }
      }
    }
    const outstanding = [];
    Object.keys(open).forEach(c => open[c].forEach(i => outstanding.push(i)));
    return { rows, questions, trail, outstanding };
  }

  // ---------- spreadsheet footing / cross-footing ----------
  function footing(grid) {
    const issues = [], checked = [];
    const num = v => { const m = parseMoney(v); return m; };
    const hasText = v => /[A-Za-z]/.test(String(v == null ? '' : v));
    let head = grid[0] || [];
    const lastIsTotal = /total/i.test(String(head[head.length - 1] || ''));
    for (let r = 1; r < grid.length; r++) {
      const row = grid[r];
      const isTotalRow = /total/i.test(String(row[0] || ''));
      for (let c = 1; c < row.length; c++) {
        const val = hasText(row[c]) ? null : num(row[c]);
        if (isTotalRow && val != null) {
          let sum = 0, n = 0;
          for (let k = r - 1; k >= 1; k--) {
            if (/total/i.test(String(grid[k][0] || ''))) break;
            const v = hasText(grid[k][c]) ? null : num(grid[k][c]);
            if (v != null) { sum += v; n++; }
          }
          if (n >= 2) {
            checked.push('Column ' + (head[c] || c) + ' total (row ' + (r + 1) + ')');
            if (sum !== val) issues.push({ where: 'Row ' + (r + 1) + ', column "' + (head[c] || c) + '"', shown: val, expect: sum, kind: 'footing', r, c });
          }
        }
      }
      if (lastIsTotal && !isTotalRow) {
        const tv = num(row[row.length - 1]);
        if (tv != null && !hasText(row[row.length - 1])) {
          let s = 0, n = 0;
          for (let c = 1; c < row.length - 1; c++) { const v = hasText(row[c]) ? null : num(row[c]); if (v != null) { s += v; n++; } }
          if (n >= 2) {
            checked.push('Row ' + (r + 1) + ' across');
            if (s !== tv) issues.push({ where: 'Row ' + (r + 1) + ' (' + (row[0] || '') + '), cross-total', shown: tv, expect: s, kind: 'cross-footing', r, c: row.length - 1 });
          }
        }
      }
    }
    return { issues, checked: checked.length };
  }

  // ---------- calculators ----------
  // Loan schedule. Monthly interest = round-half-up(balance * annual% / 12). Last payment clears the balance.
  function loan(principalPaise, annualRateBp, months) { // rate in basis points: 9.00% = 900
    const r = annualRateBp / 120000; // monthly rate as fraction
    let emi;
    if (annualRateBp === 0) emi = divRound(principalPaise, months);
    else emi = Math.round(principalPaise * r / (1 - Math.pow(1 + r, -months)));
    const rows = []; let bal = principalPaise, totInt = 0;
    for (let m = 1; m <= months; m++) {
      const interest = divRound(bal * annualRateBp, 120000);
      let pay = emi, princ = pay - interest;
      if (m === months || princ > bal) { princ = bal; pay = princ + interest; }
      bal -= princ; totInt += interest;
      rows.push({ m, pay, interest, princ, bal });
    }
    const totPaid = rows.reduce((a, x) => a + x.pay, 0);
    const putBack = rows.reduce((a, x) => a + x.princ, 0) === principalPaise; // principal repaid adds back to loan
    return { emi, rows, totInt, totPaid, putBack };
  }
  function xnpv(rate, flows) {
    const t0 = flows[0].date;
    return flows.reduce((a, f) => a + f.amt / Math.pow(1 + rate, (f.date - t0) / 365), 0);
  }
  function xirr(flows) {
    if (flows.length < 2) return { error: 'Need at least two cash flows' };
    const pos = flows.some(f => f.amt > 0), neg = flows.some(f => f.amt < 0);
    if (!pos || !neg) return { error: 'Need at least one inflow and one outflow' };
    let lo = -0.99, hi = 10, flo = xnpv(lo, flows), fhi = xnpv(hi, flows);
    if (flo * fhi > 0) return { error: 'No single rate found between -99% and 1000%. Check the signs and dates.' };
    for (let i = 0; i < 200; i++) {
      const mid = (lo + hi) / 2, fm = xnpv(mid, flows);
      if (Math.abs(fm) < 1e-9) { lo = hi = mid; break; }
      if (flo * fm < 0) { hi = mid; fhi = fm; } else { lo = mid; flo = fm; }
    }
    const rate = (lo + hi) / 2;
    return { rate, putBack: xnpv(rate, flows) };
  }
  // GST: rate in percent (whole or half), split into CGST+SGST (or IGST). Round half up to the paisa.
  function gst(amountPaise, ratePct, inclusive, interState) {
    const r100 = Math.round(ratePct * 100); // 18% -> 1800
    let base, tax;
    if (inclusive) { base = divRound(amountPaise * 10000, 10000 + r100); tax = amountPaise - base; }
    else { base = amountPaise; tax = divRound(base * r100, 10000); }
    let cgst = 0, sgst = 0, igst = 0;
    if (interState) igst = tax; else { cgst = Math.floor(tax / 2); sgst = tax - cgst; }
    return { base, tax, cgst, sgst, igst, total: base + tax };
  }

  return { setFmt, fmtINR, parseMoney, parseDate, fmtDate, fmtMoney, parseCSV, detectKind, readBank, readLedger, auditBank,
    reconcile, footing, loan, xirr, gst, divRound };
})();
if (typeof module !== 'undefined') module.exports = Engine;

</script>
<script>
const E = Engine;
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
function D(n) { const d = new Date(n * 86400000); return d.getUTCDate() + ' ' + MONTHS[d.getUTCMonth()] + ' ' + d.getUTCFullYear(); }
const uid = () => Math.random().toString(36).slice(2, 9);
const KEY = 'zygon_cognition_finance_chat_v1';

// ---------- state: many chats, each with its own files, answers and conversation ----------
let S = { chats: [], cur: null, disp: 'INR', rate: 85, theme: '' };
let DR = null;            // open document: { fi, only, flash }
let CUR = 'INR';          // currency of the loaded numbers
const RAW = {};
function newChat() { const c = { id: uid(), title: 'New chat', files: [], answers: {}, turns: [], key: null, t: Date.now() }; S.chats.unshift(c); S.cur = c.id; return c; }
function C() { let c = S.chats.find(x => x.id === S.cur); if (!c) c = newChat(); return c; }
function save() { try { S.chats = S.chats.slice(0, 25); localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { } }
function load() { try { const t = localStorage.getItem(KEY); if (t) { S = Object.assign(S, JSON.parse(t)); S.chats.forEach(c => c.turns.forEach(t => { t.pending = false; })); } } catch (e) { } if (S.theme) document.documentElement.dataset.theme = S.theme; }

      h = `<h3>${a.who ? esc(a.who) : 'Still unpaid'}</h3><p class="big">${M(tot)} unpaid across ${o.length} invoice${o.length === 1 ? '' : 's'}.</p>${!a.who && top ? `<p class="muted small">The most is owed by <b>${esc(top[0])}</b>: ${M(top[1])}.</p>` : ''}${a.who ? '' : unpaidBars(o)}${a.who ? `<div class="tbl"><table class="doc"><tbody>${o.slice(0, 8).map(i => `<tr><td>${esc(i.id)}</td><td class="n">${D(i.date)}</td><td class="n r">${M(i.amount)}</td></tr>`).join('')}</tbody></table></div>` : ''}${A.recon.questions.length ? `<div class="note warn">${A.recon.questions.length} decision(s) are still open, so this can change.</div>` : ''}`; }

function stageHtml(A) {
  const c = C();

// ---------- render ----------
function render() {

function bindAll(A) {
  const c = C();
  document.querySelectorAll('[data-say]').forEach(b => b.onclick = () => submit(b.dataset.say));
  document.querySelectorAll('[data-open]').forEach(b => b.onclick = () => { DR = { fi: +b.dataset.open, only: false }; $('#app').classList.remove('open'); render(); });

  document.querySelectorAll('input[data-only]').forEach(x => x.onchange = () => { DR.only = x.checked; render(); });
  document.querySelectorAll('[data-del]').forEach(b => b.onclick = () => { c.files.splice(+b.dataset.del, 1); c.answers = {}; DR = null; save(); render(); });
}
function answerQ(A, pay, oi) {
  const c = C(), q = A.recon.questions.find(x => x.pay === pay); if (!q) return; const had = A.recon.questions.length;
  (c.answers[pay] = c.answers[pay] || {})[q.kind] = q.options[oi].value; save();
  const after = analyze(); window.__A = after; if (had > 0 && after.recon && !after.recon.questions.length) { const t = addTurn({ q: null, kind: 'summary' }); scrollNext = true; }

function focusRow(fi, key) {

function toast(t) { const d = document.createElement('div'); d.className = 'note bad'; d.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));z-index:100;max-width:92%'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 6000); }

// ---------- files in ----------
async function take(files) {
  const c = C(); const before = c.files.length; const names = [...files].map(f => f.name);
  for (const f of files) await readFile(f);
  c.answers = {}; c.key = null; if (c.title === 'New chat' && names[0]) c.title = names[0];
  const t = addTurn({ q: 'Attached: ' + names.join(', '), kind: 'files', args: {} });
  const s = addTurn({ q: null, kind: 'summary', pending: true, steps: STEPS.summary }); scrollNext = true; save(); render();
  setTimeout(() => { s.pending = false; save(); render(); }, 900);

// drag and drop: the overlay only shows for real files and never blocks clicks
let ovTimer = null; const hideOv = () => { $('#dropov').hidden = true; clearTimeout(ovTimer); }; const hasFiles = e => e.dataTransfer && [...e.dataTransfer.types].includes('Files');
